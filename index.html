<style id="app-style">

      .normalize("NFD").replace(new RegExp("[̀-ͯ]", "g"), "")
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
    return (base || "badge") + "-" + Date.now().toString(36).slice(-4);
  }

  function groupOf(student) {
    var g = GROUPS.filter(function (g) { return g.id === student.group; })[0];
    return g || GROUPS[0];
  }

  function initials(name) {
    var parts = name.trim().split(/\s+/);
    var s = parts[0] ? parts[0][0] : "";
    if (parts[1]) s += parts[1][0];
    return s.toUpperCase();
  }

  function avatarHtml(student, size) {
    var cls = size === "lg" ? "avatar avatar-lg" : "avatar";
    var g = groupOf(student);
    if (student.photo) {
      return '<div class="' + cls + '" style="background:' + g.color + '"><img src="' + student.photo + '" alt=""></div>';
    }
    return '<div class="' + cls + '" style="background:' + g.color + ';color:' + g.text + '">' + esc(initials(student.name)) + "</div>";
  }

  function badgeByKey(key) {
    return data.badges.filter(function (b) { return b.key === key; })[0];
  }

  function badgeVisualHtml(b) {
    if (b.image) return '<img src="' + b.image + '" alt="">';
    return b.emoji || "🏅";
  }

  function fileToResizedDataURL(file, maxDim, mimeType, quality) {
    mimeType = mimeType || "image/png";
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("read-failed")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("decode-failed")); };
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          try {
            resolve(canvas.toDataURL(mimeType, quality));
          } catch (e) {
            reject(e);
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function badgeFlavor(n) {
    if (n === 0) return "Pas encore de badge — chaque séance peut en offrir un nouveau.";
    if (n <= 2) return "Une collection qui commence à prendre forme.";
    if (n <= 5) return "Une jolie brochette de badges.";
    return "Une collection impressionnante !";
  }

  function ambassadorFlavor(n) {
    if (n === 0) return "Pas encore de victoire en tant qu’ambassadeur·rice.";
    if (n <= 2) return "Ambassadeur·rice prometteur·se.";
    if (n <= 5) return "Ambassadeur·rice aguerri·e.";
    return "Grand·e Ambassadeur·rice, reconnu·e de toutes les troupes.";
  }

  function passportNumber(index) {
    return "FR-IMP-" + String(index + 1).padStart(4, "0");
  }

  function findStudent(id) {
    return data.students.filter(function (s) { return s.id === id; })[0];
  }

  function studentsByGroup(groupId) {
    return data.students
      .filter(function (s) { return s.group === groupId; })
      .sort(function (a, b) { return a.name.localeCompare(b.name, "fr"); });
  }

  function toggleBadge(studentId, key) {
    var s = findStudent(studentId);
    if (!s) return;
    var idx = s.badges.indexOf(key);
    if (idx === -1) s.badges.push(key); else s.badges.splice(idx, 1);
  }

  function addBadgeType(emoji, label, hint, image) {
    data.badges.push({ key: slugify(label), emoji: emoji || "🏅", label: label, hint: hint || "", image: image || null });
  }

  function removeBadgeType(key) {
    data.badges = data.badges.filter(function (b) { return b.key !== key; });
    data.students.forEach(function (s) {
      s.badges = s.badges.filter(function (k) { return k !== key; });
    });
  }

  function adjustAmbassador(studentId, delta) {
    var s = findStudent(studentId);
    if (!s) return;
    s.ambassadorWins = Math.max(0, (s.ambassadorWins || 0) + delta);
  }

  function setGroup(studentId, groupId) {
    var s = findStudent(studentId);
    if (!s) return;
    s.group = groupId;
  }

  function setNote(studentId, note) {
    var s = findStudent(studentId);
    if (!s) return;
    s.note = note;
  }

  function setPhoto(studentId, url) {
    var s = findStudent(studentId);
    if (!s) return;
    s.photo = url;
  }

  function clearPhoto(studentId) {
    var s = findStudent(studentId);
    if (!s) return;
    s.photo = null;
  }

  function updateSettings(title, subtitle) {

  function setBanner(url) {

  }

  function clearBanner() {

  }

  function addStudent(name, groupId) {
    var id = "s" + Date.now() + Math.floor(Math.random() * 1000);
    data.students.push({ id: id, name: name, group: groupId, ambassadorWins: 0, badges: [], note: "", photo: null });

  function renderPassport(id) {
    var s = findStudent(id);
    if (!s) { view = { screen: "cover" }; return renderCover(); }
    var index = data.students.indexOf(s);
    var group = groupOf(s);
    var ambWins = s.ambassadorWins || 0;
    var earned = (s.badges || []).map(badgeByKey).filter(Boolean);

    var shelfHtml = earned.length
      ? earned.map(function (b) {
          return (
            '<div class="badge-item" title="' + esc(b.hint || "") + '">' +
              '<div class="badge-icon">' + badgeVisualHtml(b) + "</div>" +
              '<div class="badge-label">' + esc(b.label) + "</div>" +
            "</div>"
          );
        }).join("")
      : '<p class="empty-note">Pas encore de badge — chaque séance peut en offrir un nouveau.</p>';

    var ambTicks = "";

      for (var i = 0; i < ambWins; i++) { ambTicks += '<span class="amb-tick">✓</span>'; }
    } else {
      ambTicks = '<span class="amb-empty">Aucune victoire pour l’instant.</span>';

    var noteHtml = s.note
      ? '<p class="prof-note-text">' + esc(s.note).replace(/\n/g, "<br>") + "</p>"

      '<div class="passport-wrap">' +
        '<div class="passport-grid">' +
          '<div class="passport-id">' +

            '<label class="photo-upload-btn">📷 ' + (s.photo ? "Changer ma photo" : "Ajouter ma photo") +

            '<span class="badge-count-pill">' + earned.length + " BADGE" + (earned.length > 1 ? "S" : "") + "</span>" +
          "</div>" +
          '<div class="passport-body">' +
            '<div class="prof-note-block">' +

            '<p class="flavor">' + badgeFlavor(earned.length) + "</p>" +
            '<div class="ambassador-block">' +

              '<p class="amb-count mono">' + ambWins + " victoire" + (ambWins > 1 ? "s" : "") + "</p>" +
              '<p class="flavor amb-flavor">' + ambassadorFlavor(ambWins) + "</p>" +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

              'data-student="' + esc(s.id) + '" data-badge="' + esc(b.key) + '" title="' + esc(b.hint || "") + '">' +

            "</button>"
          );
        }).join("")
      : '<span class="amb-empty">Crée un badge ci-dessus pour pouvoir l’attribuer.</span>';

    return (
      '<div class="student-editor">' +
        '<div class="student-editor-head">' +
          '<div class="student-editor-name">' + avatarHtml(s) + "<span>" + esc(s.name) + "</span></div>" +
          '<button class="remove-student" data-student="' + esc(s.id) + '">Retirer</button>' +
        "</div>" +
        '<div class="photo-row">' +

          (s.photo ? '<button type="button" class="remove-photo" data-student="' + esc(s.id) + '">Retirer la photo</button>' : "") +

        '<div class="group-select-row">' +

            '<span class="skill-count mono">' + ambWins + "</span>" +

          '<button type="submit" class="note-save-btn">Enregistrer la note</button>' +

      "</div>"
    );

              '<button type="button" class="remove-badge-type" data-badge="' + esc(b.key) + '" aria-label="Supprimer ce badge">&times;</button>' +

            '<input type="text" id="banner-subtitle" placeholder="Sous-titre" maxlength="140" value="' + esc(data.settings.subtitle || "") + '">' +
            '<input type="file" id="banner-image" accept="image/*">' +

          (data.settings.banner ? '<button type="button" id="banner-reset">Revenir au fond par défaut</button>' : "") +

        '<div class="badge-catalog-manager">' +
          "<h3>🏷️ Badges disponibles</h3>" +
          '<form id="add-badge-form">' +
            '<input type="text" id="new-badge-emoji" placeholder="🦉" maxlength="4">' +
            '<input type="text" id="new-badge-label" placeholder="Nom du badge" maxlength="40">' +
            '<input type="text" id="new-badge-hint" placeholder="Description courte (optionnel)" maxlength="80">' +
            '<input type="file" id="new-badge-image" accept="image/*">' +

    var g = GROUPS.filter(function (gr) { return gr.id === groupId; })[0];
    if (!g) { return renderTeacher(); }
    var members = studentsByGroup(g.id);
    var tilesHtml = members.length
      ? members.map(function (s) {
          return (
            '<button class="admin-tile" data-id="' + esc(s.id) + '" data-group="' + g.id + '">' +
              avatarHtml(s, "lg") +
              "<span>" + esc(s.name) + "</span>" +
            "</button>"
          );
        }).join("")
      : '<p class="empty-note">Aucun·e élève dans ce groupe pour l’instant.</p>';

    return (
      '<div class="teacher">' +
        '<button class="back-btn" id="back-admin-root">&larr; Retour aux groupes</button>' +
        '<div class="group-header"><span class="group-dot" style="background:' + g.color + '"></span><span class="group-name">' + esc(g.label) + "</span></div>" +
        '<p class="hint">Clique sur un·e élève pour modifier sa fiche.</p>' +
        '<div class="trombi-grid">' + tilesHtml + "</div>" +
        publishBarHtml() +
      "</div>"

  function renderTeacherStudent(studentId, groupId) {
    var s = findStudent(studentId);
    if (!s) { return renderTeacherGroup(groupId); }
    return (
      '<div class="teacher">' +
        '<button class="back-btn" id="back-admin-group" data-group="' + groupId + '">&larr; Retour au groupe</button>' +
        studentEditorHtml(s) +
        publishBarHtml() +
      "</div>"
    );
  }

  function render() {
    var app = document.getElementById("app");
    if (view.screen === "passport") app.innerHTML = renderPassport(view.id);
    else if (view.screen === "teacher") app.innerHTML = renderTeacher();
    else if (view.screen === "teacher-group") app.innerHTML = renderTeacherGroup(view.groupId);
    else if (view.screen === "teacher-student") app.innerHTML = renderTeacherStudent(view.studentId, view.groupId);
    else if (view.screen === "trombi") app.innerHTML = renderTrombi();
    else app.innerHTML = renderCover();
  }

  function publishData() {
    var statusEl = document.getElementById("publish-status");
    try {
      var doc = buildDocument();
      var blob = new Blob([doc], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "passeport-impro.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      if (statusEl) statusEl.textContent = "Fichier téléchargé ✓ — remplace-le sur ton hébergement.";
    } catch (err) {
      if (statusEl) statusEl.textContent = "Échec du téléchargement, réessaie.";
    }
  }

  function buildDocument() {
    var styleText = document.getElementById("app-style").textContent;
    var scriptSrc = document.getElementById("app-script").textContent;
    var newScript = scriptSrc.replace(
      /\/\*DATA_START\*\/[\s\S]*?\/\*DATA_END\*\//,
      "/*DATA_START*/" + JSON.stringify(data) + "/*DATA_END*/"
    );
    return (
      "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      "<title>Passeport Impro</title>\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
      "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap\">\n" +
      "<style id=\"app-style\">" + styleText + "</style>\n</head>\n<body>\n" +
      "<div id=\"app\"></div>\n" +
      "<script id=\"app-script\">" + newScript + "<" + "/script>\n</body>\n</html>"
    );
  }

  document.getElementById("app").addEventListener("click", function (e) {
    var ticket = e.target.closest(".ticket");
    if (ticket) { view = { screen: "passport", id: ticket.getAttribute("data-id") }; render(); return; }

    var trombiTile = e.target.closest(".trombi-tile");
    if (trombiTile) { view = { screen: "passport", id: trombiTile.getAttribute("data-id") }; render(); return; }

    if (e.target.closest("#teacher-toggle")) { view = { screen: "teacher" }; render(); return; }
    if (e.target.closest("#trombi-toggle")) { view = { screen: "trombi" }; render(); return; }
    if (e.target.closest("#back-cover")) { view = { screen: "cover" }; render(); return; }

    var groupTile = e.target.closest(".group-tile");
    if (groupTile) { view = { screen: "teacher-group", groupId: parseInt(groupTile.getAttribute("data-group"), 10) }; render(); return; }

    var adminTile = e.target.closest(".admin-tile");
    if (adminTile) { view = { screen: "teacher-student", studentId: adminTile.getAttribute("data-id"), groupId: parseInt(adminTile.getAttribute("data-group"), 10) }; render(); return; }

    if (e.target.closest("#back-admin-root")) { view = { screen: "teacher" }; render(); return; }

    var backAdminGroup = e.target.closest("#back-admin-group");
    if (backAdminGroup) { view = { screen: "teacher-group", groupId: parseInt(backAdminGroup.getAttribute("data-group"), 10) }; render(); return; }

    var badgeToggle = e.target.closest(".badge-toggle");
    if (badgeToggle) { toggleBadge(badgeToggle.getAttribute("data-student"), badgeToggle.getAttribute("data-badge")); render(); return; }

    var removeBadge = e.target.closest(".remove-badge-type");
    if (removeBadge) { removeBadgeType(removeBadge.getAttribute("data-badge")); render(); return; }

    var ambPlus = e.target.closest(".amb-plus");
    if (ambPlus) { adjustAmbassador(ambPlus.getAttribute("data-student"), 1); render(); return; }

    var ambMinus = e.target.closest(".amb-minus");
    if (ambMinus) { adjustAmbassador(ambMinus.getAttribute("data-student"), -1); render(); return; }

    var removeBtn = e.target.closest(".remove-student");
    if (removeBtn) { removeStudent(removeBtn.getAttribute("data-student")); render(); return; }

    var removePhoto = e.target.closest(".remove-photo");
    if (removePhoto) { clearPhoto(removePhoto.getAttribute("data-student")); render(); return; }

    if (e.target.closest("#banner-reset")) { clearBanner(); render(); return; }

    if (e.target.closest("#publish-btn")) { publishData(); return; }
  });

  document.getElementById("app").addEventListener("change", async function (e) {
    var groupSelect = e.target.closest(".student-group-select");
    if (groupSelect) {
      setGroup(groupSelect.getAttribute("data-student"), parseInt(groupSelect.value, 10));
      render();
      return;
    }

    var studentPhotoInput = e.target.closest(".student-photo-input");
    if (studentPhotoInput) {
      var file1 = studentPhotoInput.files && studentPhotoInput.files[0];
      if (file1) {
        try {
          var url1 = await fileToResizedDataURL(file1, 240, "image/jpeg", 0.85);
          setPhoto(studentPhotoInput.getAttribute("data-student"), url1);
          render();
        } catch (err) { /* image illisible, on ignore silencieusement */ }
      }
      return;
    }

    var selfPhotoInput = e.target.closest(".self-photo-input");
    if (selfPhotoInput) {
      var file2 = selfPhotoInput.files && selfPhotoInput.files[0];
      if (file2) {
        try {
          var url2 = await fileToResizedDataURL(file2, 240, "image/jpeg", 0.85);
          setPhoto(selfPhotoInput.getAttribute("data-student"), url2);
          render();
        } catch (err) { /* image illisible, on ignore silencieusement */ }
      }
    }
  });

  document.getElementById("app").addEventListener("submit", async function (e) {
    if (e.target && e.target.id === "add-student-form") {
      e.preventDefault();
      var input = document.getElementById("new-student-name");
      var groupSelect = document.getElementById("new-student-group");
      var name = input.value.trim();
      var groupId = parseInt(groupSelect.value, 10) || 1;
      if (name) { addStudent(name, groupId); render(); }
      return;
    }

    if (e.target && e.target.id === "add-badge-form") {
      e.preventDefault();
      var emoji = document.getElementById("new-badge-emoji").value.trim();
      var label = document.getElementById("new-badge-label").value.trim();
      var hint = document.getElementById("new-badge-hint").value.trim();
      var fileInput = document.getElementById("new-badge-image");
      var file = fileInput && fileInput.files && fileInput.files[0];
      var statusEl = document.getElementById("badge-form-status");
      if (!label) return;
      var image = null;
      if (file) {
        if (statusEl) statusEl.textContent = "Traitement de l’image…";
        try {
          image = await fileToResizedDataURL(file, 160);
        } catch (err) {
          if (statusEl) statusEl.textContent = "Image illisible, badge créé sans image.";
        }
      }
      addBadgeType(emoji, label, hint, image);
      render();
      return;
    }

    if (e.target && e.target.id === "banner-form") {
      e.preventDefault();
      var titleVal = document.getElementById("banner-title").value.trim();
      var subtitleVal = document.getElementById("banner-subtitle").value.trim();
      var bannerFileInput = document.getElementById("banner-image");
      var bannerFile = bannerFileInput && bannerFileInput.files && bannerFileInput.files[0];
      var bannerStatusEl = document.getElementById("banner-form-status");
      updateSettings(titleVal, subtitleVal);
      if (bannerFile) {
        if (bannerStatusEl) bannerStatusEl.textContent = "Traitement de l’image…";
        try {
          var bannerUrl = await fileToResizedDataURL(bannerFile, 960, "image/jpeg", 0.82);
          setBanner(bannerUrl);
        } catch (err) {
          if (bannerStatusEl) bannerStatusEl.textContent = "Image illisible, bannière non modifiée.";
          render();
          return;
        }
      }
      render();
      var statusAfter = document.getElementById("banner-form-status");
      if (statusAfter) statusAfter.textContent = "Bannière mise à jour — pense à cliquer sur « Enregistrer les modifications ».";
      return;
    }

    if (e.target && e.target.classList && e.target.classList.contains("note-form")) {
      e.preventDefault();
      var studentId = e.target.getAttribute("data-student");
      var textarea = e.target.querySelector(".note-textarea");
      setNote(studentId, textarea ? textarea.value.trim() : "");
      render();
    }
  });

  render();
})();
</script>

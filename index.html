<title>Passeport Impro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

<style id="app-style">
  :root {
    --bg: #111118;
    --bg-deep: #0d0d14;
    --surface: #1a1a26;
    --surface-dim: #15151f;
    --text: #f0ede6;
    --text-dim: #a0a0b8;
    --curtain: #ff5e3a;
    --curtain-strong: #e04a28;
    --gold: #ffc832;
    --gold-bright: #ffd966;
    --border: #2a2a3a;
    --shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.6);
    --focus: #ff5e3a;
  }

  * { box-sizing: border-box; }
  html { font-size: 18px; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }

  h1, h2, h3 { font-family: "Bebas Neue", Georgia, serif; letter-spacing: 0.02em; text-wrap: balance; margin: 0; }
  .mono { font-family: "Courier Prime", ui-monospace, monospace; }

  button, input, select, textarea {
    font-family: inherit;
    font-size: 1rem;
    color: inherit;
  }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .cover-card, .passport-wrap { animation: rise 0.5s ease-out; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- Cover ---------- */
  .cover-card {
    background:
      radial-gradient(90% 120% at 50% -10%, rgba(255, 94, 58, 0.32), transparent 60%),
      radial-gradient(70% 90% at 85% 110%, rgba(255, 200, 50, 0.14), transparent 60%),
      var(--bg-deep);
    color: var(--text);
    border-radius: 10px;
    padding: 48px 28px 40px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .cover-emblem { font-size: 2.4rem; line-height: 1; margin-bottom: 10px; }
  .cover-card h1 {
    font-family: "Bebas Neue", Georgia, serif; text-transform: uppercase;
    font-size: clamp(2.4rem, 7vw, 3.4rem); font-weight: 400; letter-spacing: 0.03em;
    text-shadow: 0 2px 24px rgba(255, 94, 58, 0.45);
  }
  .cover-sub { margin: 12px auto 0; max-width: 40ch; color: var(--text-dim); font-size: 1.02rem; line-height: 1.5; }

  .cover-links { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 26px; flex-wrap: wrap; }

  .roster { margin-top: 30px; }
  .roster-label {
    font-family: "Courier Prime", monospace;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.76rem;
    color: var(--text-dim);
    margin: 0 0 14px;
  }
  .group-section { margin: 22px 0 0; }
  .group-section:first-of-type { margin-top: 0; }
  .group-header { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .group-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .group-name {
    font-family: "Courier Prime", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .ticket {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    text-align: left;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .ticket:hover { border-color: var(--gold); transform: translateY(-1px); }
  .ticket span { font-weight: 600; }

  .avatar {
    flex: none; overflow: hidden;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Bebas Neue", serif; font-weight: 400; font-size: 1.05rem;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .avatar-lg { width: 68px; height: 68px; font-size: 1.5rem; }

  .link-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.85rem; font-weight: 600;
    padding: 10px 18px; border-radius: 999px;
  }
  .link-btn:hover { border-color: var(--curtain); color: var(--curtain); }

  .empty-note {
    text-align: center; color: var(--text-dim); font-size: 0.9rem;
    padding: 14px 10px; border: 1px dashed var(--border); border-radius: 3px;
  }

  /* ---------- Passport ---------- */
  .back-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 0.88rem; padding: 0 0 18px; display: inline-flex; align-items: center; gap: 6px;
  }
  .back-btn:hover { color: var(--text); }

  .passport-wrap {
    background: var(--surface);
    border: 1px solid rgba(255, 200, 50, 0.3);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .rank-title {
    font-family: "Bebas Neue", Georgia, serif; letter-spacing: 0.05em;
    color: var(--gold); font-size: 1rem; margin-top: -4px;
  }
  .photo-zoom-trigger { background: none; border: none; padding: 0; cursor: zoom-in; border-radius: 50%; }
  .lightbox {
    position: fixed; inset: 0; background: rgba(5, 5, 8, 0.9);
    display: flex; align-items: center; justify-content: center;
    padding: 28px; z-index: 200;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: var(--shadow); }
  #lightbox-close {
    position: absolute; top: 18px; right: 18px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 42px; height: 42px; border-radius: 50%; font-size: 1.5rem; line-height: 1;
  }
  .years-row { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; font-size: 0.88rem; color: var(--text-dim); }
  .years-row input[type="number"] {
    width: 72px; padding: 6px 8px; border-radius: 3px; border: 1px solid var(--border);
    background: var(--surface-dim); color: var(--text);
  }
  .locked-tag { font-size: 0.76rem; color: var(--text-dim); font-style: italic; font-weight: 400; }
  .passport-grid { display: grid; grid-template-columns: 200px 1fr; }
  @media (max-width: 560px) { .passport-grid { grid-template-columns: 1fr; } }

  .passport-id {
    background: var(--surface-dim);
    padding: 28px 22px;
    text-align: center;
    border-right: 2px dashed var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  @media (max-width: 560px) {
    .passport-id { border-right: none; border-bottom: 2px dashed var(--border); }
  }
  .passport-name { font-size: 1.4rem; font-weight: 600; margin-top: 4px; }
  .passport-number { color: var(--text-dim); font-size: 0.78rem; letter-spacing: 0.06em; }
  .group-pill, .badge-count-pill {
    display: inline-block;
    font-family: "Courier Prime", monospace;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .badge-count-pill { background: var(--gold); color: #201804; margin-top: 2px; }

  .photo-upload-btn {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; font-size: 0.76rem; color: var(--text-dim); cursor: pointer;
  }
  .photo-upload-btn:hover { border-color: var(--gold); }
  .photo-upload-btn input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .photo-hint { font-size: 0.76rem; color: var(--text-dim); text-align: center; max-width: 170px; margin: 0; }
  .remove-photo { background: none; border: none; color: var(--text-dim); font-size: 0.78rem; text-decoration: underline; }
  .remove-photo:hover { color: var(--curtain); }

  .passport-body { padding: 26px 24px 28px; }
  .stamps-heading {
    text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.72rem;
    color: var(--text-dim); margin: 0 0 16px;
  }

  .prof-note-block { margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px dashed var(--border); }
  .prof-note-text { font-family: Georgia, serif; font-style: italic; color: var(--text); font-size: 1.05rem; line-height: 1.55; margin: 0; }

  .badge-shelf { display: flex; flex-wrap: wrap; gap: 16px 14px; }
  .badge-item { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; }
  .badge-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 75%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    box-shadow: 0 6px 12px -6px rgba(32, 24, 4, 0.5);
    overflow: hidden;
  }
  .badge-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .badge-label { font-size: 0.72rem; text-align: center; color: var(--text-dim); line-height: 1.25; }

  .ambassador-block { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .amb-ticks { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .amb-tick {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 75%);
    color: #201804;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 700;
  }
  .amb-empty { color: var(--text-dim); font-size: 0.88rem; font-style: italic; }
  .amb-count { color: var(--text-dim); font-size: 0.8rem; }

  .flavor {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
    color: var(--text-dim); font-size: 0.9rem; font-style: italic;
  }
  .flavor.amb-flavor { margin-top: 6px; padding-top: 0; border-top: none; }

  /* ---------- Trombinoscope ---------- */
  .trombi-title { font-size: 1.4rem; margin: 0 0 20px; }
  .trombi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 18px 12px; }
  .trombi-tile, .admin-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; padding: 0; }
  .trombi-tile .avatar-lg, .admin-tile .avatar-lg { width: 82px; height: 82px; font-size: 1.6rem; }
  .trombi-tile span, .admin-tile span { font-size: 0.8rem; font-weight: 600; text-align: center; }

  .group-tiles { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
  .group-tile {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 14px 16px; text-align: left; width: 100%;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .group-tile:hover { border-color: var(--gold); transform: translateY(-1px); }
  .group-tile-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .group-tile-name { flex: 1; font-weight: 600; }
  .group-tile-count { font-family: "Courier Prime", monospace; font-size: 0.78rem; color: var(--text-dim); flex: none; }

  /* ---------- Admin mode ---------- */
  .teacher h2 { font-size: 1.5rem; margin-bottom: 6px; }
  .hint { color: var(--text-dim); font-size: 0.92rem; margin: 0 0 20px; }

  .badge-catalog-manager {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 16px 18px; margin-bottom: 26px;
  }
  .badge-catalog-manager h3 { font-size: 1.02rem; margin-bottom: 10px; }
  #add-badge-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  #new-badge-emoji {
    width: 62px; flex: 0 0 auto; padding: 10px; border-radius: 3px; text-align: center; font-size: 1.15rem;
    border: 1px solid var(--border); background: var(--surface-dim); color: var(--text);
  }
  #new-badge-label, #new-badge-hint {
    flex: 1 1 160px; padding: 10px 12px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface-dim); color: var(--text);
  }
  #new-badge-image {
    flex: 1 1 200px; padding: 8px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface-dim); color: var(--text-dim); font-size: 0.85rem;
  }
  #add-badge-form button {
    background: var(--curtain); color: #fff; border: none;
    padding: 10px 16px; border-radius: 3px; font-weight: 600;
  }
  #add-badge-form button:hover { background: var(--curtain-strong); }
  .badge-form-hint { font-size: 0.8rem; color: var(--text-dim); margin: -6px 0 14px; }
  #badge-form-status { font-size: 0.82rem; color: var(--text-dim); display: block; margin: -6px 0 14px; }
  .badge-catalog-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge-catalog-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-dim); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 8px 5px 10px; font-size: 0.85rem;
  }
  .badge-catalog-chip img, .badge-toggle img {
    width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex: none;
  }
  .remove-badge-type { background: none; border: none; color: var(--text-dim); font-size: 0.95rem; line-height: 1; padding: 0 2px; }
  .remove-badge-type:hover { color: var(--curtain); }

  #banner-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  #banner-form input[type="text"] {
    flex: 1 1 200px; padding: 10px 12px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface-dim); color: var(--text);
  }
  #banner-form input[type="file"] {
    flex: 1 1 200px; padding: 8px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface-dim); color: var(--text-dim); font-size: 0.85rem;
  }
  #banner-form button {
    background: var(--curtain); color: #fff; border: none;
    padding: 10px 16px; border-radius: 3px; font-weight: 600;
  }
  #banner-form button:hover { background: var(--curtain-strong); }
  #banner-reset {
    background: none; border: none; color: var(--text-dim); font-size: 0.82rem;
    text-decoration: underline; padding: 0; margin: 0 0 6px;
  }
  #banner-reset:hover { color: var(--curtain); }
  #banner-form-status { font-size: 0.82rem; color: var(--text-dim); display: block; }

  #add-student-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  #new-student-name {
    flex: 1 1 180px; padding: 10px 12px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  #new-student-group {
    flex: 0 0 auto; padding: 10px 12px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  #add-student-form button {
    background: var(--curtain); color: #fff; border: none;
    padding: 10px 16px; border-radius: 3px; font-weight: 600;
  }
  #add-student-form button:hover { background: var(--curtain-strong); }

  .student-editor {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .student-editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .student-editor-name { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .remove-student { background: none; border: none; color: var(--text-dim); font-size: 0.82rem; text-decoration: underline; }
  .remove-student:hover { color: var(--curtain); }

  .photo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .photo-row .photo-upload-btn { padding: 6px 12px; font-size: 0.82rem; background: var(--surface-dim); }

  .group-select-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 12px; }
  .student-group-select { padding: 5px 8px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface-dim); color: var(--text); font-size: 0.82rem; }

  .badge-toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 4px; }
  .badge-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 6px 12px; font-size: 0.85rem;
    border: 1px solid var(--border); background: var(--surface-dim); color: var(--text-dim);
  }
  .badge-toggle:hover { border-color: var(--gold); }
  .badge-toggle.earned { background: var(--gold); border-color: var(--gold); color: #201804; font-weight: 600; }

  .skill-editor-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .skill-editor-name { font-size: 0.9rem; color: var(--text-dim); flex: 1; }
  .skill-editor-controls { display: flex; align-items: center; gap: 10px; }
  .pip-btn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-dim); font-weight: 700; line-height: 1;
  }
  .pip-btn:hover { border-color: var(--gold); }
  .skill-count { font-family: "Courier Prime", monospace; font-size: 0.85rem; min-width: 32px; text-align: center; }

  .amb-editor-row { margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .amb-editor-row .skill-editor-name { color: var(--gold); font-weight: 600; }

  .note-form { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .note-label { display: block; font-size: 0.82rem; color: var(--gold); font-weight: 600; margin-bottom: 6px; }
  .note-textarea {
    width: 100%; min-height: 60px; padding: 8px 10px; border-radius: 3px; resize: vertical;
    border: 1px solid var(--border); background: var(--surface-dim); color: var(--text); font-family: inherit; font-size: 0.9rem;
    margin-bottom: 8px;
  }
  .note-save-btn {
    background: var(--surface-dim); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 12px; border-radius: 3px; font-size: 0.82rem;
  }
  .note-save-btn:hover { border-color: var(--gold); color: var(--text); }

  .publish-bar {
    position: sticky; bottom: 0;
    display: flex; align-items: center; gap: 14px;
    background: var(--bg);
    padding: 16px 0 4px;
    border-top: 1px solid var(--border);
    margin-top: 10px;
  }
  #publish-btn {
    background: var(--gold); color: #201804; border: none; font-weight: 700;
    padding: 12px 20px; border-radius: 3px;
  }
  #publish-btn:hover { background: var(--gold-bright); }
  #publish-status { font-size: 0.85rem; color: var(--text-dim); }

  .sync-indicator {
    position: fixed; right: 14px; bottom: 14px; max-width: min(280px, calc(100vw - 28px));
    font-family: "Courier Prime", monospace; font-size: 0.72rem; line-height: 1.3;
    padding: 7px 11px; border-radius: 3px; z-index: 50;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    box-shadow: var(--shadow);
  }
  .sync-indicator.ok { color: #2B3A55; border-color: #2B3A55; }
  .sync-indicator.err { color: var(--curtain); border-color: var(--curtain); }
  .fb-config-details summary { cursor: pointer; font-weight: 600; margin: 10px 0 6px; }
  #fb-config-status, #fb-reconnect { font-size: 0.85rem; }
  #fb-reconnect { margin: 6px 0; }

  .admin-lock { max-width: 360px; margin: 40px auto; text-align: center; }
  .admin-lock h2 { margin-bottom: 4px; }
  .admin-lock form { display: flex; gap: 8px; margin-top: 14px; }
  .admin-lock input { flex: 1; }
  .admin-lock-error { color: var(--curtain); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }
</style>

<div id="app"></div>
<div id="sync-indicator" class="sync-indicator" hidden></div>
<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" aria-label="Fermer">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script id="app-script">
(function () {
  "use strict";

  var GROUPS = [
    { id: 1, label: "Cours du Lundi (Boris Vian)", color: "#E0637A", text: "#2A0F14" },
    { id: 2, label: "Cours du Lundi (Albert Dubout)", color: "#D9A53A", text: "#241A05" },
    { id: 3, label: "Cours débutant du Mardi (PEV)", color: "#3FB8A6", text: "#052421" },
    { id: 4, label: "Cours Jeudi ST BRES", color: "#9A8CE0", text: "#140C33" }
  ];

          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;

            reject(e);
          }

        img.src = reader.result;
      };
      reader.readAsDataURL(file);

  function render() {

    else if (view.screen === "teacher") app.innerHTML = renderTeacher();
    else if (view.screen === "teacher-group") app.innerHTML = renderTeacherGroup(view.groupId);
    else if (view.screen === "teacher-student") app.innerHTML = renderTeacherStudent(view.studentId, view.groupId);
    else if (view.screen === "trombi") app.innerHTML = renderTrombi();
    else app.innerHTML = renderCover();

  function publishData() {
    var statusEl = document.getElementById("publish-status");
    try {
      var doc = buildDocument();
      var blob = new Blob([doc], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "passeport-impro.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      if (statusEl) statusEl.textContent = "Fichier téléchargé ✓ — remplace-le sur ton hébergement.";
    } catch (err) {
      if (statusEl) statusEl.textContent = "Échec du téléchargement, réessaie.";
    }
  }

  function buildDocument() {
    var styleText = document.getElementById("app-style").textContent;
    var scriptSrc = document.getElementById("app-script").textContent;
    var newScript = scriptSrc.replace(
      /\/\*DATA_START\*\/[\s\S]*?\/\*DATA_END\*\//,
      "/*DATA_START*/" + JSON.stringify(data) + "/*DATA_END*/"
    );
    return (
      "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      "<title>Passeport Impro</title>\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
      "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap\">\n" +
      "<script src=\"https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js\"><" + "/script>\n" +
      "<script src=\"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js\"><" + "/script>\n" +
      "<style id=\"app-style\">" + styleText + "</style>\n</head>\n<body>\n" +
      "<div id=\"app\"></div>\n" +
      "<div id=\"sync-indicator\" class=\"sync-indicator\" hidden></div>\n" +
      "<div id=\"lightbox\" class=\"lightbox\" hidden><button id=\"lightbox-close\" aria-label=\"Fermer\">&times;</button><img id=\"lightbox-img\" src=\"\" alt=\"\"></div>\n" +
      "<script id=\"app-script\">" + newScript + "<" + "/script>\n</body>\n</html>"
    );
  }

  document.getElementById("app").addEventListener("click", function (e) {
    var zoomTrigger = e.target.closest(".photo-zoom-trigger");
    if (zoomTrigger) { openLightbox(zoomTrigger.getAttribute("data-photo")); return; }

    var ticket = e.target.closest(".ticket");
    if (ticket) { view = { screen: "passport", id: ticket.getAttribute("data-id") }; render(); return; }

    var trombiTile = e.target.closest(".trombi-tile");
    if (trombiTile) { view = { screen: "passport", id: trombiTile.getAttribute("data-id") }; render(); return; }

    if (e.target.closest("#teacher-toggle")) {
      if (data.settings.adminCode && !adminUnlocked) {
        view = { screen: "admin-lock" }; render(); return;
      }
      view = { screen: "teacher" }; render(); return;
    }

    if (e.target.closest("#admin-lock-cancel")) { view = { screen: "cover" }; render(); return; }
    if (e.target.closest("#trombi-toggle")) { view = { screen: "trombi" }; render(); return; }
    if (e.target.closest("#back-cover")) { view = { screen: "cover" }; render(); return; }

    var groupTile = e.target.closest(".group-tile");
    if (groupTile) { view = { screen: "teacher-group", groupId: parseInt(groupTile.getAttribute("data-group"), 10) }; render(); return; }

    var adminTile = e.target.closest(".admin-tile");
    if (adminTile) { view = { screen: "teacher-student", studentId: adminTile.getAttribute("data-id"), groupId: parseInt(adminTile.getAttribute("data-group"), 10) }; render(); return; }

    if (e.target.closest("#back-admin-root")) { view = { screen: "teacher" }; render(); return; }

    var backAdminGroup = e.target.closest("#back-admin-group");
    if (backAdminGroup) { view = { screen: "teacher-group", groupId: parseInt(backAdminGroup.getAttribute("data-group"), 10) }; render(); return; }

    var badgeToggle = e.target.closest(".badge-toggle");
    if (badgeToggle) { toggleBadge(badgeToggle.getAttribute("data-student"), badgeToggle.getAttribute("data-badge")); render(); return; }

    var removeBadge = e.target.closest(".remove-badge-type");
    if (removeBadge) { removeBadgeType(removeBadge.getAttribute("data-badge")); render(); return; }

    var ambPlus = e.target.closest(".amb-plus");
    if (ambPlus) { adjustAmbassador(ambPlus.getAttribute("data-student"), 1); render(); return; }

    var ambMinus = e.target.closest(".amb-minus");
    if (ambMinus) { adjustAmbassador(ambMinus.getAttribute("data-student"), -1); render(); return; }

    var removeBtn = e.target.closest(".remove-student");
    if (removeBtn) { removeStudent(removeBtn.getAttribute("data-student")); render(); return; }

    var removePhoto = e.target.closest(".remove-photo");
    if (removePhoto) { clearPhoto(removePhoto.getAttribute("data-student")); render(); return; }

    if (e.target.closest("#banner-reset")) { clearBanner(); render(); return; }

    if (e.target.closest("#publish-btn")) { publishData(); return; }

    if (e.target.closest("#fb-reconnect")) { connectAndSync(); return; }

    if (e.target.closest("#admin-code-remove")) {
      setAdminCode(null);
      render();
      var removedStatus = document.getElementById("admin-code-status");
      if (removedStatus) removedStatus.textContent = "Code retiré.";
      return;
    }
  });

  document.getElementById("app").addEventListener("change", async function (e) {
    var groupSelect = e.target.closest(".student-group-select");
    if (groupSelect) {
      setGroup(groupSelect.getAttribute("data-student"), parseInt(groupSelect.value, 10));
      render();

      var file1 = studentPhotoInput.files && studentPhotoInput.files[0];
      if (file1) {
        try {
          var url1 = await fileToResizedDataURL(file1, 240, "image/jpeg", 0.85);
          setPhoto(studentPhotoInput.getAttribute("data-student"), url1);
          render();
        } catch (err) { /* image illisible, on ignore silencieusement */ }
      }
      return;
    }

    var selfPhotoInput = e.target.closest(".self-photo-input");
    if (selfPhotoInput) {
      var file2 = selfPhotoInput.files && selfPhotoInput.files[0];
      if (file2) {
        try {
          var url2 = await fileToResizedDataURL(file2, 240, "image/jpeg", 0.85);
          setPhoto(selfPhotoInput.getAttribute("data-student"), url2);
          render();
        } catch (err) { /* image illisible, on ignore silencieusement */ }
      }

  document.getElementById("app").addEventListener("submit", async function (e) {
    if (e.target && e.target.id === "add-student-form") {
      e.preventDefault();
      var input = document.getElementById("new-student-name");
      var groupSelect = document.getElementById("new-student-group");
      var name = input.value.trim();
      var groupId = parseInt(groupSelect.value, 10) || 1;
      if (name) { addStudent(name, groupId); render(); }
      return;
    }

    if (e.target && e.target.id === "add-badge-form") {
      e.preventDefault();
      var emoji = document.getElementById("new-badge-emoji").value.trim();
      var label = document.getElementById("new-badge-label").value.trim();
      var hint = document.getElementById("new-badge-hint").value.trim();
      var fileInput = document.getElementById("new-badge-image");
      var file = fileInput && fileInput.files && fileInput.files[0];
      var statusEl = document.getElementById("badge-form-status");
      if (!label) return;
      var image = null;
      if (file) {
        if (statusEl) statusEl.textContent = "Traitement de l’image…";
        try {
          image = await fileToResizedDataURL(file, 160);
        } catch (err) {
          if (statusEl) statusEl.textContent = "Image illisible, badge créé sans image.";
        }
      }
      addBadgeType(emoji, label, hint, image);
      render();
      return;
    }

    if (e.target && e.target.id === "banner-form") {
      e.preventDefault();
      var titleVal = document.getElementById("banner-title").value.trim();
      var subtitleVal = document.getElementById("banner-subtitle").value.trim();
      var bannerFileInput = document.getElementById("banner-image");
      var bannerFile = bannerFileInput && bannerFileInput.files && bannerFileInput.files[0];
      var bannerStatusEl = document.getElementById("banner-form-status");
      updateSettings(titleVal, subtitleVal);
      if (bannerFile) {
        if (bannerStatusEl) bannerStatusEl.textContent = "Traitement de l’image…";
        try {
          var bannerUrl = await fileToResizedDataURL(bannerFile, 960, "image/jpeg", 0.82);
          setBanner(bannerUrl);
        } catch (err) {
          if (bannerStatusEl) bannerStatusEl.textContent = "Image illisible, bannière non modifiée.";
          render();
          return;
        }
      }
      render();
      var statusAfter = document.getElementById("banner-form-status");
      if (statusAfter) {
        statusAfter.textContent = fb.ready
          ? "Bannière mise à jour ✓"
          : "Bannière mise à jour — pense à cliquer sur « Télécharger la page mise à jour » en bas.";
      }
      return;
    }

    if (e.target && e.target.classList && e.target.classList.contains("note-form")) {
      e.preventDefault();
      var studentId = e.target.getAttribute("data-student");
      var textarea = e.target.querySelector(".note-textarea");
      setNote(studentId, textarea ? textarea.value.trim() : "");
      render();
      return;
    }

    if (e.target && e.target.classList && e.target.classList.contains("profile-form")) {
      e.preventDefault();
      var profileStudentId = e.target.getAttribute("data-student");
      var bioInput = e.target.querySelector(".profile-bio-input");
      var parcoursInput = e.target.querySelector(".profile-parcours-input");
      var yearsInput = e.target.querySelector(".profile-years-input");
      var yearsVal = yearsInput && yearsInput.value !== "" ? parseInt(yearsInput.value, 10) : null;
      setProfile(
        profileStudentId,
        bioInput ? bioInput.value.trim() : "",
        parcoursInput ? parcoursInput.value.trim() : "",
        yearsVal
      );
      render();
      return;
    }

    if (e.target && e.target.id === "admin-lock-form") {
      e.preventDefault();
      var lockInput = document.getElementById("admin-lock-input");
      var lockErrorEl = document.getElementById("admin-lock-error");
      var attempt = lockInput ? lockInput.value : "";
      if (attempt && attempt === data.settings.adminCode) {
        adminUnlocked = true;
        view = { screen: "teacher" };
        render();
      } else if (lockErrorEl) {
        lockErrorEl.textContent = "Code incorrect, réessaie.";
        if (lockInput) { lockInput.value = ""; lockInput.focus(); }
      }
      return;
    }

    if (e.target && e.target.id === "admin-code-form") {
      e.preventDefault();
      var codeInput = document.getElementById("admin-code-input");
      var codeVal = codeInput ? codeInput.value.trim() : "";
      var codeStatusEl = document.getElementById("admin-code-status");
      if (!codeVal) {
        if (codeStatusEl) codeStatusEl.textContent = "Tape un code avant d’enregistrer.";
        return;
      }
      setAdminCode(codeVal);
      render();
      var codeStatusEl2 = document.getElementById("admin-code-status");
      if (codeStatusEl2) codeStatusEl2.textContent = "Code enregistré ✓";
      return;
    }

    if (e.target && e.target.id === "firebase-config-form") {
      e.preventDefault();
      var cfg = {
        apiKey: document.getElementById("fb-apiKey").value.trim(),
        authDomain: document.getElementById("fb-authDomain").value.trim(),
        projectId: document.getElementById("fb-projectId").value.trim(),
        storageBucket: document.getElementById("fb-storageBucket").value.trim(),
        messagingSenderId: document.getElementById("fb-messagingSenderId").value.trim(),
        appId: document.getElementById("fb-appId").value.trim()
      };
      var fbStatusEl = document.getElementById("fb-config-status");
      if (!fbConfigValid(cfg)) {
        if (fbStatusEl) fbStatusEl.textContent = "Il manque au moins un champ obligatoire (apiKey, authDomain, projectId, appId).";
        return;
      }
      setFirebaseConfig(cfg);
      if (fbStatusEl) fbStatusEl.textContent = "Connexion en cours…";
      connectAndSync().then(function () {
        var fbStatusEl2 = document.getElementById("fb-config-status");
        if (fbStatusEl2) {
          fbStatusEl2.textContent = fb.ready
            ? "Connecté ! Clique maintenant sur « Télécharger la page mise à jour » puis remplace le fichier là où le site est hébergé — une dernière fois — pour activer la sauvegarde en ligne pour tout le monde."
            : "Échec de connexion — vérifie les informations copiées depuis Firebase.";
        }
      });
      return;
    }
  });

  function openLightbox(src) {
    if (!src) return;
    var lb = document.getElementById("lightbox");
    var img = document.getElementById("lightbox-img");
    if (img) img.src = src;
    if (lb) lb.hidden = false;
  }

  function closeLightbox() {
    var lb = document.getElementById("lightbox");
    var img = document.getElementById("lightbox-img");
    if (lb) lb.hidden = true;
    if (img) img.src = "";
  }

  var lightboxEl = document.getElementById("lightbox");
  if (lightboxEl) {
    lightboxEl.addEventListener("click", function (e) {
      if (e.target.id === "lightbox" || e.target.id === "lightbox-close") closeLightbox();
    });
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });

  render();
  connectAndSync();
})();
</script>

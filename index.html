<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Passeport Impro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style id="app-style">
  :root {
    --bg: #111118;
    --bg-deep: #0d0d14;
    --surface: #1a1a26;
    --surface-dim: #15151f;
    --text: #f0ede6;
    --text-dim: #a0a0b8;
    --curtain: #ff5e3a;
    --curtain-strong: #e04a28;
    --gold: #ffc832;
    --gold-bright: #ffd966;
    --border: #2a2a3a;
    --shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.6);
    --focus: #ff5e3a;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  #app { max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }
  h1, h2, h3 { font-family: "Bebas Neue", Georgia, serif; letter-spacing: 0.02em; text-wrap: balance; margin: 0; }
  .mono { font-family: "Courier Prime", ui-monospace, monospace; }
  a { color: var(--gold); }

  button, input, select, textarea { font-family: inherit; font-size: 1rem; color: var(--text); }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  input, select, textarea {
    background: var(--surface-dim); border: 1px solid var(--border);
    border-radius: 3px; padding: 9px 11px;
  }
  input[type="checkbox"] { width: auto; padding: 0; }
  textarea { width: 100%; resize: vertical; font-family: inherit; }
  label { display: block; font-size: 0.82rem; color: var(--gold); font-weight: 600; margin: 14px 0 5px; }
  .field-hint { font-size: 0.76rem; color: var(--text-dim); margin: 2px 0 0; }

  .btn { background: var(--curtain); color: #fff; border: none; font-weight: 600; padding: 10px 18px; border-radius: 3px; }
  .btn:hover { background: var(--curtain-strong); }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 9px 16px; border-radius: 3px; }
  .btn-ghost:hover { border-color: var(--gold); color: var(--text); }
  .btn-link { background: none; border: none; color: var(--text-dim); text-decoration: underline; padding: 0; font-size: 0.85rem; }
  .btn-link:hover { color: var(--curtain); }
  .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
  .btn-danger { background: none; border: 1px solid var(--curtain); color: var(--curtain); padding: 6px 12px; border-radius: 3px; font-size: 0.82rem; }
  .btn-danger:hover { background: var(--curtain); color: #fff; }

  .top-nav {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between;
    padding-bottom: 20px; margin-bottom: 24px; border-bottom: 2px solid var(--border);
  }
  .top-nav .brand { font-family: "Bebas Neue", Georgia, serif; font-size: 1.6rem; letter-spacing: 0.03em; }
  .top-nav .brand span { color: var(--curtain); }
  .nav-links { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav-links button { background: none; border: none; color: var(--text-dim); padding: 6px 10px; font-size: 0.88rem; border-radius: 3px; }
  .nav-links button:hover, .nav-links button.active { color: var(--text); background: var(--surface); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px 22px; margin-bottom: 18px; overflow: hidden; }
  .profile-banner-img { display: block; width: calc(100% + 44px); max-height: 260px; object-fit: cover; margin: -20px -22px 18px; cursor: zoom-in; }
  @media (max-width: 560px) { .profile-banner-img { max-height: 180px; } }
  .hint { color: var(--text-dim); font-size: 0.88rem; }
  .error-msg { color: var(--curtain); font-size: 0.85rem; margin-top: 8px; min-height: 1.1em; }
  .success-msg { color: var(--gold); font-size: 0.85rem; margin-top: 8px; min-height: 1.1em; }

  .hero { text-align: center; padding: 40px 10px 20px; }
  .hero h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); }
  .hero h1 span { color: var(--curtain); }
  .hero p { color: var(--text-dim); max-width: 520px; margin: 10px auto 26px; }
  .hero-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .home-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 22px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .home-tile:hover { border-color: var(--gold); }
  .home-tile .emoji { font-size: 1.8rem; }

  .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .form-row > * { flex: 1 1 200px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

  .chip-check {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem;
    cursor: pointer; margin: 3px 4px 3px 0;
  }
  .chip-check input { margin: 0; }
  .chip-check.checked { border-color: var(--gold); background: rgba(255, 200, 50, 0.12); }

  .avatar {
    border-radius: 50%; object-fit: cover; background: var(--surface-dim);
    display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-weight: 700;
    flex: none;
  }
  .avatar-xl { width: 130px; height: 130px; font-size: 2.6rem; }
  .avatar-md { width: 64px; height: 64px; font-size: 1.3rem; }
  .avatar-sm { width: 42px; height: 42px; font-size: 1rem; }

  .profile-head { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .profile-head h2 { font-size: 2rem; }
  .profile-pseudo { color: var(--curtain); font-weight: 600; }
  .profile-meta { color: var(--text-dim); font-size: 0.92rem; }
  .level-pill {
    display: inline-block; background: var(--gold); color: #201804; font-weight: 700;
    font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; margin-top: 4px;
  }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat-box { background: var(--surface-dim); border: 1px solid var(--border); border-radius: 6px; padding: 12px 10px; text-align: center; }
  .stat-box .num { font-family: "Bebas Neue", Georgia, serif; font-size: 1.5rem; color: var(--gold); display: block; }
  .stat-box .lbl { font-size: 0.72rem; color: var(--text-dim); }

  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .badge-pill {
    display: inline-flex; align-items: center; gap: 6px; background: var(--gold); color: #201804;
    border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; font-weight: 600;
  }
  .badge-locked {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-dim); color: var(--text-dim);
    border: 1px dashed var(--border); border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; opacity: 0.7;
  }

  .section-title { font-size: 1.15rem; margin: 26px 0 10px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .section-title:first-of-type { border-top: none; padding-top: 0; margin-top: 6px; }

  .list-item {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    background: var(--surface-dim); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .list-item .li-main { flex: 1; }
  .list-item .li-title { font-weight: 600; }
  .list-item .li-sub { color: var(--text-dim); font-size: 0.82rem; }
  .empty-hint { color: var(--text-dim); font-style: italic; font-size: 0.88rem; margin: 6px 0 14px; }

  .link-list a { display: inline-block; margin: 0 12px 6px 0; }

  .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin: 10px 0; }
  .photo-gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; }

  .directory-list { display: flex; flex-direction: column; gap: 8px; }
  .directory-row {
    display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 16px; text-align: left; width: 100%;
  }
  .directory-row:hover { border-color: var(--gold); }
  .directory-row .dr-name { font-weight: 600; }
  .directory-row .dr-sub { color: var(--text-dim); font-size: 0.85rem; }

  #map-container { height: 480px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); margin-top: 12px; }
  .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); }
  .leaflet-popup-tip { background: var(--surface); }
  .map-popup a { color: var(--gold); }

  .back-btn { background: none; border: none; color: var(--text-dim); font-size: 0.95rem; margin-bottom: 18px; padding: 0; }
  .back-btn:hover { color: var(--curtain); }

  .auth-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .auth-tabs button { flex: 1; background: var(--surface-dim); border: 1px solid var(--border); padding: 10px; border-radius: 3px; color: var(--text-dim); }
  .auth-tabs button.active { background: var(--curtain); color: #fff; border-color: var(--curtain); }

  .sync-indicator {
    position: fixed; right: 14px; bottom: 14px; max-width: min(280px, calc(100vw - 28px));
    font-family: "Courier Prime", monospace; font-size: 0.72rem; line-height: 1.3;
    padding: 7px 11px; border-radius: 3px; z-index: 50;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    box-shadow: var(--shadow);
  }
  .sync-indicator.err { color: var(--curtain); border-color: var(--curtain); }

  .remove-x { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; line-height: 1; padding: 0 2px; }
  .remove-x:hover { color: var(--curtain); }

  .lightbox {
    position: fixed; inset: 0; background: rgba(8, 8, 12, 0.92); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 30px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #lightbox-close {
    position: absolute; top: 18px; right: 18px; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); width: 42px; height: 42px; border-radius: 50%; font-size: 1.5rem; line-height: 1;
  }

  @media (max-width: 560px) { .profile-head { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<div id="app">Chargement…</div>
<script id="app-script">
(function () {
  "use strict";

  /* ================= Config ================= */
  /* __SUPABASE_URL__ et __SUPABASE_ANON_KEY__ sont remplacés par les
     vraies valeurs du projet Supabase de Drawer avant mise en ligne.
     Ce ne sont pas des secrets : la vraie protection vient des règles
     de sécurité (RLS) définies côté Supabase. */
  var SUPABASE_URL = "https://onlyvuhcvyowhldpxugl.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ubHl2dWhjdnlvd2hsZHB4dWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzg0NDMsImV4cCI6MjEwNDgxNDQ0M30.rI5MgGXSnWWnRSjWAoBi9fqrXD2bHb1PHQbqE6IiwKk";
  var AVATAR_BUCKET = "avatars";
  var PHOTOS_BUCKET = "photos";

  var supa = null;
  var supaReady = false;

  var DISCIPLINES = [
    "Match d'impro", "Catch impro", "Longform", "Solo", "Théâtre invisible",
    "Impro musicale", "Impro en langue étrangère", "Café-théâtre improvisé"
  ];
  var ROLES = [
    { key: "joueur", label: "Joueur·se" },
    { key: "arbitre", label: "Arbitre" },
    { key: "mc", label: "Maître·sse de cérémonie" },
    { key: "coach", label: "Coach" },
    { key: "metteur_scene", label: "Metteur·se en scène" }
  ];

  /* ================= État ================= */
  var session = null;
  var myProfile = null;
  var view = { screen: "home" };
  var lightboxUrl = null;
  var busy = false;

  /* ================= Petits utilitaires ================= */
  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function currentYear() { return new Date().getFullYear(); }
  function appEl() { return $("app"); }
  function setHash(h) { if (location.hash !== h) location.hash = h; else route(); }
  function fmtYears(from, to) {
    if (!from) return "";
    var end = to || currentYear();
    var n = end - from;
    return from + (to ? "–" + to : " – aujourd’hui") + " (" + n + " an" + (n > 1 ? "s" : "") + ")";
  }

  /* ================= Initialisation Supabase ================= */
  function initSupabase() {
    try {
      if (!window.supabase || !window.supabase.createClient) return false;
      if (SUPABASE_URL.indexOf("__") === 0 || SUPABASE_ANON_KEY.indexOf("__") === 0) return false;
      supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      supaReady = true;
      return true;
    } catch (e) {
      console.error("Supabase init error", e);
      return false;
    }
  }

  function syncIndicatorHtml() {
    if (supaReady) return "";
    return '<div class="sync-indicator err">⚠️ Connexion au serveur indisponible pour l’instant. Réessaie plus tard.</div>';
  }
  /* ================= Auth ================= */
  async function doSignUp(email, password) {
    if (!supaReady) return { error: "Connexion au serveur indisponible." };
    var res = await supa.auth.signUp({ email: email, password: password });
    if (res.error) return { error: translateAuthError(res.error) };
    session = res.data.session;
    return { ok: true, needsConfirm: !res.data.session };
  }
  async function doSignIn(email, password) {
    if (!supaReady) return { error: "Connexion au serveur indisponible." };
    var res = await supa.auth.signInWithPassword({ email: email, password: password });
    if (res.error) return { error: translateAuthError(res.error) };
    session = res.data.session;
    return { ok: true };
  }
  async function doSignOut() {
    if (supaReady) { try { await supa.auth.signOut(); } catch (e) {} }
    session = null;
    myProfile = null;
  }
  async function requestPasswordReset(email) {
    if (!supaReady) return { error: "Connexion au serveur indisponible." };
    var res = await supa.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (res.error) return { error: translateAuthError(res.error) };
    return { ok: true };
  }
  async function updateMyPassword(password) {
    if (!supaReady) return { error: "Connexion au serveur indisponible." };
    var res = await supa.auth.updateUser({ password: password });
    if (res.error) return { error: translateAuthError(res.error) };
    return { ok: true };
  }
  function translateAuthError(err) {
    var msg = (err && err.message) || "";
    if (/already registered/i.test(msg)) return "Un compte existe déjà avec cet email.";
    if (/invalid login/i.test(msg)) return "Email ou mot de passe incorrect.";
    if (/password/i.test(msg) && /6/i.test(msg)) return "Le mot de passe doit faire au moins 6 caractères.";
    if (/rate limit/i.test(msg)) return "Trop de tentatives, réessaie dans un instant.";
    return msg || "Une erreur est survenue.";
  }

  /* ================= Données : profil ================= */
  async function loadMyProfile() {
    if (!supaReady || !session) { myProfile = null; return; }
    var res = await supa.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    myProfile = res.data || null;
  }
  async function fetchProfileByPseudo(pseudo) {
    var res = await supa.from("profiles").select("*").eq("pseudo", pseudo).maybeSingle();
    return res.data || null;
  }
  async function fetchAllProfiles() {
    var res = await supa.from("profiles").select("*").order("created_at", { ascending: false });
    return res.data || [];
  }
  async function saveMyProfile(fields) {
    fields.id = session.user.id;
    var res = await supa.from("profiles").upsert(fields).select().maybeSingle();
    if (res.error) return { error: res.error.message };
    myProfile = res.data;
    return { ok: true };
  }

  /* ================= Données : troupes ================= */
  async function fetchAllTroupes() {
    var res = await supa.from("troupes").select("*").order("created_at", { ascending: false });
    return res.data || [];
  }
  async function fetchTroupeById(id) {
    var res = await supa.from("troupes").select("*").eq("id", id).maybeSingle();
    return res.data || null;
  }
  async function createTroupe(fields) {
    fields.created_by = session.user.id;
    var res = await supa.from("troupes").insert(fields).select().maybeSingle();
    if (res.error) return { error: res.error.message };
    return { ok: true, troupe: res.data };
  }
  async function updateTroupe(id, fields) {
    var res = await supa.from("troupes").update(fields).eq("id", id).select().maybeSingle();
    if (res.error) return { error: res.error.message };
    return { ok: true, troupe: res.data };
  }

  /* ================= Données génériques liées (membres/tournois/équipes/photos/vidéos) ================= */
  async function fetchRelated(table, ownerType, ownerId) {
    var q = supa.from(table).select("*").eq("owner_type", ownerType).eq("owner_id", ownerId);
    if (table !== "troupe_membres") q = q.order("created_at", { ascending: false });
    var res = await q;
    return res.data || [];
  }
  async function fetchMembresDeTroupe(troupeId) {
    var res = await supa.from("troupe_membres").select("*, profiles(pseudo, nom_complet, avatar_url)").eq("troupe_id", troupeId);
    return res.data || [];
  }
  async function fetchTroupesDuProfil(profileId) {
    var res = await supa.from("troupe_membres").select("*, troupes(id, nom, ville, pays)").eq("profile_id", profileId);
    return res.data || [];
  }
  async function addRelated(table, payload) {
    var res = await supa.from(table).insert(payload).select().maybeSingle();
    if (res.error) return { error: res.error.message };
    return { ok: true, row: res.data };
  }
  async function removeRelated(table, id) {
    var res = await supa.from(table).delete().eq("id", id);
    if (res.error) return { error: res.error.message };
    return { ok: true };
  }
  /* ================= Géocodage (adresse/ville/pays -> coordonnées, pour la carte) ================= */
  async function geocode(ville, pays, adresse) {
    var q = [adresse, ville, pays].filter(Boolean).join(", ");
    if (!q) return null;
    try {
      var url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q);
      var res = await fetch(url, { headers: { "Accept-Language": "fr" } });
      var data = await res.json();
      if (data && data[0]) return { latitude: parseFloat(data[0].lat), longitude: parseFloat(data[0].lon) };
    } catch (e) { console.warn("Géocodage impossible", e); }
    return null;
  }

  /* ================= Upload de fichiers (avatars / photos) ================= */
  function fileExt(file) {
    var m = /\.([a-zA-Z0-9]+)$/.exec(file.name || "");
    return m ? m[1].toLowerCase() : "jpg";
  }
  async function uploadAvatar(file) {
    var path = session.user.id + "/" + Date.now() + "." + fileExt(file);
    var res = await supa.storage.from(AVATAR_BUCKET).upload(path, file, { upsert: true });
    if (res.error) return { error: res.error.message };
    var pub = supa.storage.from(AVATAR_BUCKET).getPublicUrl(path);
    return { ok: true, url: pub.data.publicUrl };
  }
  async function uploadBanner(file) {
    var path = session.user.id + "/banner-" + Date.now() + "." + fileExt(file);
    var res = await supa.storage.from(AVATAR_BUCKET).upload(path, file, { upsert: true });
    if (res.error) return { error: res.error.message };
    var pub = supa.storage.from(AVATAR_BUCKET).getPublicUrl(path);
    return { ok: true, url: pub.data.publicUrl };
  }
  async function uploadPhoto(ownerType, ownerId, file) {
    var path = ownerType + "/" + ownerId + "/" + Date.now() + "." + fileExt(file);
    var res = await supa.storage.from(PHOTOS_BUCKET).upload(path, file);
    if (res.error) return { error: res.error.message };
    var pub = supa.storage.from(PHOTOS_BUCKET).getPublicUrl(path);
    return { ok: true, url: pub.data.publicUrl };
  }
  /* ================= Hauts faits (badges) & niveau ================= */
  var BADGE_DEFS = [
    { key: "spectacles50", emoji: "🔥", label: "50 spectacles", test: function (p, s) { return (p.nb_spectacles || 0) >= 50; } },
    { key: "etranger", emoji: "🌍", label: "Une expérience à l’étranger", test: function (p, s) { return s.paysCount >= 2; } },
    { key: "stagiaire_assidu", emoji: "📚", label: "3 stages suivis", test: function (p, s) { return s.stagesCount >= 3; } },
    { key: "mc", emoji: "🎤", label: "Maître·sse de cérémonie", test: function (p, s) { return (p.roles || []).indexOf("mc") !== -1; } },
    { key: "arbitre", emoji: "🚩", label: "Arbitre", test: function (p, s) { return (p.roles || []).indexOf("arbitre") !== -1; } },
    { key: "coach", emoji: "🧑‍🏫", label: "Coach", test: function (p, s) { return (p.roles || []).indexOf("coach") !== -1; } },
    { key: "dix_equipes", emoji: "⚔️", label: "10 équipes rencontrées", test: function (p, s) { return s.equipesCount >= 10; } },
    { key: "dix_ans", emoji: "👑", label: "10 ans d’impro", test: function (p, s) { return p.annee_debut_impro && (currentYear() - p.annee_debut_impro) >= 10; } },
    { key: "trois_troupes", emoji: "👥", label: "3 troupes ou plus", test: function (p, s) { return s.troupesCount >= 3; } },
    { key: "polyvalent", emoji: "🎭", label: "Touche-à-tout (3 rôles)", test: function (p, s) { return (p.roles || []).length >= 3; } }
  ];
  function computeBadges(profile, s) {
    return BADGE_DEFS.filter(function (b) { return b.test(profile, s); });

  function computeScore(profile, s) {
    return (profile.nb_spectacles || 0) * 2 + s.stagesCount * 4 +

  var LEVEL_TITLES = ["Novice", "Apprenti·e", "Confirmé·e", "Vétéran·e", "Virtuose", "Légende"];
  function computeLevel(score) {
    var level = 1 + Math.floor(score / 40);
    var titleIndex = Math.min(LEVEL_TITLES.length - 1, Math.floor(level / 5));

  /* ================= Routage (hash) ================= */
  function parseHash() {
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
    if (parts.length === 0) return { screen: "home" };
    if (parts[0] === "connexion") return { screen: "auth" };
    if (parts[0] === "mon-profil") return { screen: "my-profile-edit" };
    if (parts[0] === "joueurs") return { screen: "players" };
    if (parts[0] === "profil" && parts[1]) return { screen: "profile", pseudo: parts[1] };
    if (parts[0] === "troupes") return { screen: "troupes" };
    if (parts[0] === "troupe" && parts[1] === "nouvelle") return { screen: "troupe-edit" };
    if (parts[0] === "troupe" && parts[1] && parts[2] === "modifier") return { screen: "troupe-edit", id: parts[1] };
    if (parts[0] === "troupe" && parts[1]) return { screen: "troupe", id: parts[1] };
    if (parts[0] === "carte") return { screen: "map" };
    return { screen: "home" };

  async function initLeafletMap() {
    var el = $("map-container");
    if (!el || !window.L) return;
    if (leafletMap) { leafletMap.remove(); leafletMap = null; }
    leafletMap = L.map(el).setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(leafletMap);
    var troupes = await fetchAllTroupes();
    var withCoords = troupes.filter(function (t) { return t.latitude != null && t.longitude != null; });
    withCoords.forEach(function (t) {
      var marker = L.marker([t.latitude, t.longitude]).addTo(leafletMap);
      marker.bindPopup('<div class="map-popup"><strong>' + esc(t.nom) + "</strong><br>" + esc(t.ville || "") + "<br><a href=\"#/troupe/" + esc(t.id) + "\">Voir la fiche</a></div>");
    });
    if (withCoords.length) {
      var bounds = L.latLngBounds(withCoords.map(function (t) { return [t.latitude, t.longitude]; }));
      leafletMap.fitBounds(bounds.pad(0.3));
    }
  }

  /* ================= Lightbox ================= */
  function showLightbox(url) {
    var div = document.createElement("div");
    div.id = "lightbox"; div.className = "lightbox";
    div.innerHTML = '<button id="lightbox-close" aria-label="Fermer">&times;</button><img src="' + esc(url) + '" alt="">';
    document.body.appendChild(div);
  }
  function closeLightbox() { var el = $("lightbox"); if (el) el.remove(); }

  /* ================= Événements ================= */
  document.addEventListener("click", async function (e) {
    var navBtn = e.target.closest("[data-nav]");
    if (navBtn) { e.preventDefault(); setHash(navBtn.getAttribute("data-nav")); return; }

    if (e.target.closest("#nav-logout")) { await doSignOut(); setHash("#/"); return; }

    var authModeBtn = e.target.closest("[data-authmode]");
    if (authModeBtn) { view.mode = authModeBtn.getAttribute("data-authmode"); render(); return; }

    var photoTrigger = e.target.closest(".photo-zoom-trigger");
    if (photoTrigger) { showLightbox(photoTrigger.getAttribute("data-photo")); return; }
    if (e.target.closest("#lightbox-close") || e.target.id === "lightbox") { closeLightbox(); return; }

    var chip = e.target.closest(".chip-check");
    if (chip) { setTimeout(function () { chip.classList.toggle("checked", chip.querySelector("input").checked); }, 0); }

    if (e.target.id === "view-my-profile" && myProfile) { setHash("#/profil/" + encodeURIComponent(myProfile.pseudo)); return; }

    var removeBtn = e.target.closest("[data-remove]");
    if (removeBtn) {
      if (busy) return;
      busy = true;
      var table = removeBtn.getAttribute("data-remove");
      var id = removeBtn.getAttribute("data-id");
      await removeRelated(table, id);
      busy = false;
      render();
      return;
    }
    var removeLien = e.target.closest("[data-remove-lien]");
    if (removeLien && myProfile) {
      if (busy) return;
      busy = true;
      var idx = parseInt(removeLien.getAttribute("data-remove-lien"), 10);
      var liens = (myProfile.liens || []).slice();
      liens.splice(idx, 1);
      await saveMyProfile({ liens: liens });
      busy = false;
      render();
      return;
    }
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLightbox(); });

  document.addEventListener("submit", async function (e) {
    if (busy) { e.preventDefault(); return; }

    if (e.target.id === "auth-form") {
      e.preventDefault();
      var email = $("auth-email").value.trim();
      var password = $("auth-password").value;
      var errEl = $("auth-error"), okEl = $("auth-success");
      errEl.textContent = ""; okEl.textContent = "";
      busy = true;
      var res = view.mode === "login" ? await doSignIn(email, password) : await doSignUp(email, password);
      busy = false;
      if (res.error) { errEl.textContent = res.error; return; }
      if (res.needsConfirm) { okEl.textContent = "Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi."; return; }
      setHash("#/mon-profil");
      return;
    }

    if (e.target.id === "forgot-form") {
      e.preventDefault();
      var fpEmail = $("forgot-email").value.trim();
      var fpErr = $("auth-error"), fpOk = $("auth-success");
      fpErr.textContent = ""; fpOk.textContent = "";
      busy = true;
      var fpRes = await requestPasswordReset(fpEmail);
      busy = false;
      if (fpRes.error) { fpErr.textContent = fpRes.error; return; }
      fpOk.textContent = "Si un compte existe avec cet email, un lien vient d’être envoyé.";
      return;
    }

    if (e.target.id === "reset-password-form") {
      e.preventDefault();
      var rpErr = $("auth-error");
      rpErr.textContent = "";
      var rpPassword = $("reset-password-input").value;
      busy = true;
      var rpRes = await updateMyPassword(rpPassword);
      busy = false;
      if (rpRes.error) { rpErr.textContent = rpRes.error; return; }
      setHash("#/mon-profil");
      return;
    }

    if (e.target.id === "profile-form") {
      e.preventDefault();
      var f = e.target;
      var errEl2 = $("profile-form-error");
      errEl2.textContent = "";
      var fields = {
        pseudo: f.pseudo.value.trim().toLowerCase(),
        nom_complet: f.nom_complet.value.trim(),
        ville: f.ville.value.trim(),
        pays: f.pays.value.trim(),
        annee_debut_impro: f.annee_debut_impro.value ? parseInt(f.annee_debut_impro.value, 10) : null,
        mentor: f.mentor.value.trim(),
        disciplines: Array.prototype.slice.call(f.querySelectorAll('[name="disciplines"]:checked')).map(function (i) { return i.value; }),
        roles: Array.prototype.slice.call(f.querySelectorAll('[name="roles"]:checked')).map(function (i) { return i.value; }),
        nb_spectacles: f.nb_spectacles.value ? parseInt(f.nb_spectacles.value, 10) : 0,
        bio: f.bio.value.trim()
      };
      if (!/^[a-zA-Z0-9_\-.]{3,30}$/.test(fields.pseudo)) { errEl2.textContent = "Pseudo invalide (3 à 30 caractères, lettres/chiffres/_-. uniquement)."; return; }
      busy = true;
      var avatarFile = $("avatar-input") && $("avatar-input").files[0];
      if (avatarFile) {
        var up = await uploadAvatar(avatarFile);
        if (up.error) { busy = false; errEl2.textContent = "Photo : " + up.error; return; }
        fields.avatar_url = up.url;
      }
      var bannerFile = $("banner-input") && $("banner-input").files[0];
      if (bannerFile) {
        var upB = await uploadBanner(bannerFile);
        if (upB.error) { busy = false; errEl2.textContent = "Bannière : " + upB.error; return; }
        fields.banner_url = upB.url;
      }
      if (!fields.ville && !fields.pays) {
        // pas de géocodage possible
      } else if (!myProfile || myProfile.ville !== fields.ville || myProfile.pays !== fields.pays) {
        var geo = await geocode(fields.ville, fields.pays);
        if (geo) { fields.latitude = geo.latitude; fields.longitude = geo.longitude; }
      }
      var res2 = await saveMyProfile(fields);
      busy = false;
      if (res2.error) {
        errEl2.textContent = /duplicate|unique/i.test(res2.error) ? "Ce pseudo est déjà pris, choisis-en un autre." : res2.error;
        return;
      }
      render();
      return;
    }

    if (e.target.id === "troupe-form") {
      e.preventDefault();
      var tf = e.target;
      var errEl3 = $("troupe-form-error");
      errEl3.textContent = "";
      var tfields = {
        nom: tf.nom.value.trim(),
        adresse: tf.adresse.value.trim(),
        ville: tf.ville.value.trim(),
        pays: tf.pays.value.trim(),
        fondee_en: tf.fondee_en.value ? parseInt(tf.fondee_en.value, 10) : null,
        description: tf.description.value.trim(),
        style_impro: tf.style_impro.value.trim(),
        lieu_residence: tf.lieu_residence.value.trim(),
        site_web: tf.site_web.value.trim(),
        instagram: tf.instagram.value.trim(),
        facebook: tf.facebook.value.trim(),
        email_contact: tf.email_contact.value.trim(),
        nb_spectacles: tf.nb_spectacles.value ? parseInt(tf.nb_spectacles.value, 10) : 0
      };
      busy = true;
      var logoFile = $("troupe-logo-input") && $("troupe-logo-input").files[0];
      var existingId = tf.getAttribute("data-id");
      if (tfields.ville || tfields.pays || tfields.adresse) {
        var geo2 = await geocode(tfields.ville, tfields.pays, tfields.adresse);
        if (geo2) { tfields.latitude = geo2.latitude; tfields.longitude = geo2.longitude; }
      }
      var result;
      if (existingId) {
        if (logoFile) {
          var up2 = await uploadPhoto("troupe", existingId, logoFile);
          if (up2.error) { busy = false; errEl3.textContent = "Logo : " + up2.error; return; }
          tfields.logo_url = up2.url;
        }
        result = await updateTroupe(existingId, tfields);
      } else {
        result = await createTroupe(tfields);
        if (result.ok && logoFile) {
          var up3 = await uploadPhoto("troupe", result.troupe.id, logoFile);
          if (up3.error) { busy = false; errEl3.textContent = "Troupe créée, mais le logo n’a pas pu être envoyé : " + up3.error; return; }
          await updateTroupe(result.troupe.id, { logo_url: up3.url });
        }
      }
      busy = false;
      if (result.error) { errEl3.textContent = result.error; return; }
      setHash("#/troupe/" + result.troupe.id);
      return;
    }

    var addForm = e.target.closest(".add-form");
    if (addForm) {
      e.preventDefault();
      if (busy) return;
      busy = true;
      var kind = addForm.getAttribute("data-kind");
      var statusEl = $("manage-status");
      try {
        if (kind === "membre") {
          var troupeId = addForm.getAttribute("data-troupe");
          var pseudo = addForm.pseudo.value.trim().toLowerCase();
          var prof = await fetchProfileByPseudo(pseudo);
          if (!prof) { if (statusEl) statusEl.textContent = "Aucun improvisateur avec ce pseudo."; busy = false; return; }
          await addRelated("troupe_membres", {
            troupe_id: troupeId, profile_id: prof.id,
            annee_debut: addForm.annee_debut.value ? parseInt(addForm.annee_debut.value, 10) : null
          });
        } else if (kind === "troupe-membre") {
          await addRelated("troupe_membres", {
            troupe_id: addForm.troupe_id.value, profile_id: myProfile.id,
            annee_debut: addForm.annee_debut.value ? parseInt(addForm.annee_debut.value, 10) : null,
            annee_fin: addForm.annee_fin.value ? parseInt(addForm.annee_fin.value, 10) : null
          });
        } else if (kind === "tournoi") {
          await addRelated("tournois", {
            owner_type: addForm.getAttribute("data-owner-type"), owner_id: addForm.getAttribute("data-owner-id"),
            nom: addForm.nom.value.trim(),
            annee: addForm.annee.value ? parseInt(addForm.annee.value, 10) : null,
            ville: addForm.ville.value.trim(), pays: addForm.pays.value.trim()
          });
        } else if (kind === "equipe") {
          await addRelated("equipes_rencontrees", {
            owner_type: addForm.getAttribute("data-owner-type"), owner_id: addForm.getAttribute("data-owner-id"),
            nom_equipe: addForm.nom_equipe.value.trim()
          });
        } else if (kind === "video") {
          await addRelated("videos", {
            owner_type: addForm.getAttribute("data-owner-type"), owner_id: addForm.getAttribute("data-owner-id"),
            url: addForm.url.value.trim(), caption: addForm.caption.value.trim()
          });
        } else if (kind === "photo") {
          var file = addForm.photo.files[0];
          if (file) {
            var ownerType = addForm.getAttribute("data-owner-type"), ownerId = addForm.getAttribute("data-owner-id");
            var upr = await uploadPhoto(ownerType, ownerId, file);
            if (upr.error) { if (statusEl) statusEl.textContent = upr.error; busy = false; return; }
            await addRelated("photos", { owner_type: ownerType, owner_id: ownerId, url: upr.url });
          }
        } else if (kind === "lien") {
          var liens = (myProfile.liens || []).slice();
          liens.push({ label: addForm.label.value.trim(), url: addForm.url.value.trim() });
          await saveMyProfile({ liens: liens });
        }
      } catch (err) {
        if (statusEl) statusEl.textContent = "Une erreur est survenue.";
      }
      busy = false;
      render();
      return;
    }
  });

  window.addEventListener("hashchange", route);

  /* ================= Démarrage ================= */
  async function boot() {
    initSupabase();
    if (supaReady) {
      try {
        var s = await supa.auth.getSession();
        session = s.data.session;
      } catch (e) {}
      supa.auth.onAuthStateChange(function (_event, newSession) {
        session = newSession;
        if (_event === "PASSWORD_RECOVERY") { view = { screen: "reset-password" }; render(); }
      });
    }
    route();
  }
  boot();
})();
</script>
</body>
</html>
